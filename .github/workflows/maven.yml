---
name: build
run-name: build ${{  github.ref_name }} ('${{ github.event.head_commit.message }}')

on:
  push:
    branches: [MMBase-1_9, main]
    tags:
      - '*' # Push events to every tag
  pull_request:
    branches: [MMBase-1_9, main]

  workflow_dispatch:
    inputs:
      skipTests:
        description: 'Skip tests'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-latest
    container:
     image: ghcr.io/mmbase/build:9-jdk8
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
    steps:
      - uses: actions/checkout@v6
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_SECRET_KEY }}" | gpg --batch --import
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Show dependencies
        run: |
          cd core
          mvn dependency:tree
      - name: Build with Maven
        run: ./build-all.sh
        env:
          BATCH_MODE: true
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
      - name: Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()    # run this step even if previous step failed
        with:
          files: '**/target/surefire-reports/TEST-*.xml'    # Path to test
      - uses: codecov/codecov-action@v5
        if: github.ref == 'refs/heads/MMBase-1_9'
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
      - uses: MMProgrami/after-maven-action@v2
      - name: Set variables
        id: vars
        run: |
          git config --global --add safe.directory /__w/mmbase/mmbase
          commit_timestamp=$(git show -s --format="%ci" ${{github.sha}})
          echo commit $commit_timestamp
          echo "commit_timestamp=${commit_timestamp}" >> "$GITHUB_OUTPUT"
          echo project_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) >>  "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wars
          path: |
              example-webapp/target/*.war
              example-webapp/Dockerfile
              base-webapp/target/*.war
              base-webapp/Dockerfile
              applications/commandserver/Dockerfile
              applications/commandserver/target/*.jar
  integration-tests:
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
    needs: maven
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mmbase/build:9-jdk8
    steps:
      - uses: actions/checkout@v6
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Run integration tests
        run: |
          cd tests
          make all
      - name: Show summary of results
        run: |
          grep -E "=====|Tests run|OK" tests/work/all.log
      - uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            tests/work
  docker:
    needs: maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
         - directory: example-webapp
           name: example-webapp
         - directory: base-webapp
           name: base-webapp
         - directory: applications/commandserver
           name: commandserver
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v8
        with:
          name: "wars"
          path: .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute semantic version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/MMBase-')
        run: |
          TAG="${GITHUB_REF#refs/tags/MMBase-}"
          # Convert MMBase tag format to semver: 1_9_7_rc1 -> 1.9.7-rc1, 1_9_7_Final -> 1.9.7
          SEMVER=$(echo "$TAG" | sed -E 's/_/./g; s/\.Final$//; s/\.([a-zA-Z])/-\1/')
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "$SEMVER" | cut -d. -f1)
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mmbase/${{matrix.name}}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.semver }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          annotations: |
            index:org.opencontainers.image.documentation=https://github.com/mmbase/mmbase/tree/MMBase-1_9/${{matrix.directory}}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ${{ matrix.directory }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mmbase/buildcache:${{ matrix.name }}
          cache-to: type=registry,ref=ghcr.io/mmbase/buildcache:${{ matrix.name }},mode=max
          platforms: linux/amd64,linux/arm64
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=target
          build-args: |
            CI_COMMIT_REF_NAME=${{ github.ref_name }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_TITLE=${{ github.event.head_commit.message }}
            CI_COMMIT_TIMESTAMP=${{ needs.build.outputs.outputs.commit_timestamp }}
            PROJECT_VERSION=${{ needs.build.outputs.outputs.project_version }}






