---
name: build
on:
  push:
    branches: [MMBase-1_9, main]
  pull_request:
    branches: [MMBase-1_9, main]
  workflow_dispatch:
    inputs:
      skipTests:
        description: 'Skip tests'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-latest
    container:
     image: ghcr.io/mmbase/build:3
    env:
      MAVEN_ARGS: '--no-transfer-progress'
    steps:
      - uses: actions/checkout@v6
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_SECRET_KEY }}" | gpg --batch --import
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Build with Maven
        run: ./build-all.sh
        env:
          BATCH_MODE: true
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
      - name: Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()    # run this step even if previous step failed
        with:
          files: '**/target/surefire-reports/TEST-*.xml'    # Path to test
      - uses: codecov/codecov-action@v5
        if: github.ref == 'refs/heads/MMBase-1_9'
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
      - uses: MMProgrami/after-maven-action@v2
      - name: Set variables
        id: vars
        run: |
          commit_timestamp=$(git show -s --format="%ci" ${{github.sha}})
          echo commit $commit_timestamp
          echo "commit_timestamp=${commit_timestamp}" >> "$GITHUB_OUTPUT"
          echo project_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) >>  "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: wars
          path: |
              example-webapp/target/*.war
              example-webapp/Dockerfile
              base-webapp/target/*.war
              base-webapp/Dockerfile

  integration-tests:
    env:
      MAVEN_ARGS: '--no-transfer-progress'
    needs: maven
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mmbase/build:latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Run integration tests
        run: |
          cd tests
          make all
      - name: Show summary of results
        run: |
          cat tests/work/all.log  | grep -E "=====|Tests run|OK"
      - uses: actions/upload-artifact@v6
        with:
          name: logs
          path: |
            tests/work
  docker:
    needs: maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        directory: [ example-webapp, base-webapp ]
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v7
        with:
          name: "wars"
          path: .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mmbase/${{matrix.directory}}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=pep440,pattern={{major}},event=tag
          annotations: |
            index:org.opencontainers.image.documentation=https://github.com/mmbase/mmbase/tree/MMBase-1_9/${{matrix.directory}}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.directory }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mmbase/${{ matrix.directory }}:buildcache
          cache-to: type=registry,ref=ghcr.io/mmbase/${{ matrix.directory }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=target
          build-args: |
            CI_COMMIT_REF_NAME=${{ github.ref_name }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_TITLE=${{ github.event.head_commit.message }}
            CI_COMMIT_TIMESTAMP=${{ needs.build.outputs.outputs.commit_timestamp }}
            PROJECT_VERSION=${{ needs.build.outputs.outputs.project_version }}






